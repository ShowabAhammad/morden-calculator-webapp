<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="calculator-shell">
      <div class="calculator">
        <header class="calculator-header">
          <div class="brand">Calc</div>
          <div class="dot-group" aria-label="Status">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </header>

        <section class="display" aria-live="polite" aria-atomic="true">
          <div id="expression" class="expression">0</div>
          <div id="result" class="result">0</div>
        </section>

        <section class="keys" aria-label="Calculator keypad">
          <button class="key secondary" data-action="clear">AC</button>
          <button class="key secondary" data-action="delete">⌫</button>
          <button class="key secondary" data-action="percent">%</button>
          <button class="key operator" data-action="divide">÷</button>

          <button class="key" data-digit="7">7</button>
          <button class="key" data-digit="8">8</button>
          <button class="key" data-digit="9">9</button>
          <button class="key operator" data-action="multiply">×</button>

          <button class="key" data-digit="4">4</button>
          <button class="key" data-digit="5">5</button>
          <button class="key" data-digit="6">6</button>
          <button class="key operator" data-action="subtract">−</button>

          <button class="key" data-digit="1">1</button>
          <button class="key" data-digit="2">2</button>
          <button class="key" data-digit="3">3</button>
          <button class="key operator" data-action="add">+</button>

          <button class="key wide" data-action="sign">±</button>
          <button class="key" data-digit="0">0</button>
          <button class="key" data-action="decimal">.</button>
          <button class="key equals" data-action="equals">=</button>
        </section>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

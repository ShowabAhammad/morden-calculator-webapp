<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Modern Calculator Preview</title>
  <desc id="desc">A modern calculator interface with a dark glassmorphism design.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f1220"/>
      <stop offset="100%" stop-color="#171c2e"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8d78ff"/>
      <stop offset="100%" stop-color="#5d4ae7"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#7f6bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#52d6c3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#52d6c3" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  <rect width="1200" height="900" fill="url(#orb1)"/>
  <rect width="1200" height="900" fill="url(#orb2)"/>

  <g transform="translate(350,110)" filter="url(#shadow)">
    <rect x="0" y="0" width="500" height="680" rx="36" fill="rgba(17,20,31,0.76)" stroke="rgba(255,255,255,0.08)"/>

    <rect x="26" y="24" width="448" height="120" rx="24" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)"/>
    <text x="42" y="64" fill="#a8afc8" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="3">CALC</text>

    <g transform="translate(380,48)">
      <circle cx="0" cy="0" r="8" fill="#8d78ff" opacity="0.9"/>
      <circle cx="28" cy="0" r="8" fill="#52d6c3" opacity="0.8"/>
      <circle cx="56" cy="0" r="8" fill="#7f6bff" opacity="0.7"/>
    </g>

    <rect x="26" y="160" width="448" height="170" rx="24" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)"/>
    <text x="400" y="212" fill="#a8afc8" font-size="26" font-family="Arial, Helvetica, sans-serif" text-anchor="end">12 × 8</text>
    <text x="400" y="300" fill="#f4f7ff" font-size="70" font-family="Arial, Helvetica, sans-serif" text-anchor="end" font-weight="600">96</text>

    <g transform="translate(26,360)">
      <g transform="translate(0,0)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.08)"/>
        <text x="50" y="37" fill="#dfe5ff" font-size="27" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">AC</text>
      </g>
      <g transform="translate(112,0)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.08)"/>
        <text x="50" y="37" fill="#dfe5ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">⌫</text>
      </g>
      <g transform="translate(224,0)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.08)"/>
        <text x="50" y="37" fill="#dfe5ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">%</text>
      </g>
      <g transform="translate(336,0)">
        <rect width="100" height="58" rx="16" fill="rgba(127,107,255,0.28)"/>
        <text x="50" y="38" fill="#b6a8ff" font-size="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">÷</text>
      </g>

      <g transform="translate(0,72)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.06)"/>
        <text x="50" y="38" fill="#f4f7ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">7</text>
      </g>
      <g transform="translate(112,72)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.06)"/>
        <text x="50" y="38" fill="#f4f7ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">8</text>
      </g>
      <g transform="translate(224,72)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.06)"/>
        <text x="50" y="38" fill="#f4f7ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">9</text>
      </g>
      <g transform="translate(336,72)">
        <rect width="100" height="58" rx="16" fill="rgba(127,107,255,0.28)"/>
        <text x="50" y="38" fill="#b6a8ff" font-size="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">×</text>
      </g>

      <g transform="translate(0,144)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.06)"/>
        <text x="50" y="38" fill="#f4f7ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">4</text>
      </g>
      <g transform="translate(112,144)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.06)"/>
        <text x="50" y="38" fill="#f4f7ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">5</text>
      </g>
      <g transform="translate(224,144)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.06)"/>
        <text x="50" y="38" fill="#f4f7ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">6</text>
      </g>
      <g transform="translate(336,144)">
        <rect width="100" height="58" rx="16" fill="rgba(127,107,255,0.28)"/>
        <text x="50" y="38" fill="#b6a8ff" font-size="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">−</text>
      </g>

      <g transform="translate(0,216)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.06)"/>
        <text x="50" y="38" fill="#f4f7ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text>
      </g>
      <g transform="translate(112,216)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.06)"/>
        <text x="50" y="38" fill="#f4f7ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2</text>
      </g>
      <g transform="translate(224,216)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.06)"/>
        <text x="50" y="38" fill="#f4f7ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3</text>
      </g>
      <g transform="translate(336,216)">
        <rect width="100" height="58" rx="16" fill="rgba(127,107,255,0.28)"/>
        <text x="50" y="38" fill="#b6a8ff" font-size="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">+</text>
      </g>

      <g transform="translate(0,288)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.08)"/>
        <text x="50" y="38" fill="#dfe5ff" font-size="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">±</text>
      </g>
      <g transform="translate(112,288)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.06)"/>
        <text x="50" y="38" fill="#f4f7ff" font-size="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">0</text>
      </g>
      <g transform="translate(224,288)">
        <rect width="100" height="58" rx="16" fill="rgba(255,255,255,0.06)"/>
        <text x="50" y="38" fill="#f4f7ff" font-size="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">.</text>
      </g>
      <g transform="translate(336,288)">
        <rect width="100" height="58" rx="16" fill="url(#purpleGlow)"/>
        <text x="50" y="39" fill="#ffffff" font-size="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">=</text>
      </g>
    </g>
  </g>
</svg>
